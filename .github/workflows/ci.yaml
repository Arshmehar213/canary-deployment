name: CI — Test, Scan & Publish to GHCR

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Default workflow-level permissions set to strict read-only.
# Write access to packages is elevated strictly inside the 'publish' job.
permissions:
  contents: read

# Cancel superseded runs on feature branches/PRs, but never interrupt an active main branch publish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  REGISTRY: ghcr.io
  PYTHON_VERSION: "3.12"
  IMAGE_ARTIFACT_NAME: canary-demo-app-oci-tarball

jobs:

  # Stage 1: Unit & Fault-Injection Testing
  test:
    name: Pytest Unit & Fault-Injection Suite
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Execute pytest suite
        run: |
          pytest -v --tb=short

  # Stage 2: Build Image Once & Scan with Trivy
  build-and-scan:
    name: Build Docker Image & Trivy Security Scan
    needs: [test]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read

    outputs:
      image_repo: ${{ steps.meta.outputs.image_repo }}
      short_sha: ${{ steps.meta.outputs.short_sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Derive lowercase repository name and immutable SHA tags
        id: meta
        run: |
          IMAGE_REPO=$(echo "${{ env.REGISTRY }}/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          SHORT_SHA="sha-$(echo "${{ github.sha }}" | cut -c1-12)"
          echo "image_repo=${IMAGE_REPO}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Build container image with GitHub Actions layer cache
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: |
            ${{ steps.meta.outputs.image_repo }}:${{ github.sha }}
            ${{ steps.meta.outputs.image_repo }}:${{ steps.meta.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.run_started_at }}

      - name: Run Trivy vulnerability scan (HIGH & CRITICAL gate)
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0 # 0.28.0
        with:
          image-ref: "${{ steps.meta.outputs.image_repo }}:${{ github.sha }}"
          format: "table"
          exit-code: "1"
          ignore-unfixed: false
          vuln-type: "os,library"
          severity: "HIGH,CRITICAL"
          trivyignores: ".trivyignore.yaml"

      - name: Export verified image archive for downstream publish job
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker save "${{ steps.meta.outputs.image_repo }}:${{ github.sha }}" -o /tmp/image.tar

      - name: Upload verified image artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ env.IMAGE_ARTIFACT_NAME }}
          path: /tmp/image.tar
          retention-days: 1
          if-no-files-found: error

 
  # Stage 3: Publish Verified Image to GHCR (Main Branch Pushes Only)
  publish:
    name: Publish Verified Image to GHCR
    needs: [test, build-and-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download verified image artifact from build-and-scan
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ env.IMAGE_ARTIFACT_NAME }}
          path: /tmp

      - name: Load verified Docker image archive
        run: |
          docker load -i /tmp/image.tar

      - name: Authenticate to GitHub Container Registry (GHCR)
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push immutable SHA and latest tags to GHCR
        env:
          IMAGE_REPO: ${{ needs.build-and-scan.outputs.image_repo }}
          FULL_SHA: ${{ github.sha }}
          SHORT_SHA: ${{ needs.build-and-scan.outputs.short_sha }}
        run: |
          docker tag "${IMAGE_REPO}:${FULL_SHA}" "${IMAGE_REPO}:${SHORT_SHA}"
          docker tag "${IMAGE_REPO}:${FULL_SHA}" "${IMAGE_REPO}:latest"

          docker push "${IMAGE_REPO}:${FULL_SHA}"
          docker push "${IMAGE_REPO}:${SHORT_SHA}"
          docker push "${IMAGE_REPO}:latest"

          echo "### Published GHCR Image Tags" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${IMAGE_REPO}:${FULL_SHA}\` (Immutable 40-char commit SHA)" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${IMAGE_REPO}:${SHORT_SHA}\` (Immutable 12-char short SHA)" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${IMAGE_REPO}:latest\` (Main branch rolling tag)" >> "$GITHUB_STEP_SUMMARY"